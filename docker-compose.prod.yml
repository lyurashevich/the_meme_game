---
services:
  db_prod:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${PROD_DB_NAME:-game_bd_prod}
      POSTGRES_USER: ${PROD_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-postgres}
    volumes:
      - ./postgres_data_prod:/var/lib/postgresql/data_prod
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  django_prod:
    build:
      context: django_app
      dockerfile: Dockerfile
      target: base
    depends_on:
      db_prod:
        condition: service_healthy
    env_file:
      - .env-prod
    environment:
      DB_NAME: ${PROD_DB_NAME:-docker_db}
      DB_USER: ${PROD_DB_USER:-postgres}
      DB_PASSWORD: ${PROD_DB_PASSWORD:-postgres}
      DB_HOST: ${PROD_DB_HOST:-db}
      DB_PORT: ${PROD_DB_PORT:-5432}
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/healthcheck/"]
      interval: 15s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: always
    command:
      - sh
      - -c
      - |
          "gunicorn --workers $((2 * $(nproc)))
          meme_game.wsgi:application --bind 0.0.0.0:8000"

  fastapi_prod:
    build:
      context: websockets
      dockerfile: Dockerfile
      target: base
    depends_on:
      redis_prod:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis_prod:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command:
      - sh
      - -c
      - uvicorn main:app --host 0.0.0.0 --port 8000 --workers $(( 2 * $(nproc)))

  redis_prod:
    image: redis:8.0-M03-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - redis_data:/redis_data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-vinograd}

  nginx:
    build: nginx
    volumes:
      - ./ReactUI:/usr/share/nginx/html/
      - static_volume:/app/static
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
    ports:
      - "8080:80"
    environment:
      - SWS_AUTH=${SWS_AUTH:-YWRtaW46YWRtaW4=}
    command: >-
      /bin/sh -c "envsubst '$$SWS_AUTH' < /etc/nginx/nginx.conf.template > \
      /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      sws:
        condition: service_started
      django-prod:
        condition: service_healthy
      fastapi-prod:
        condition: service_healthy

  sws:
    image: joseluisq/static-web-server:2-alpine
    ports:
      - "8787:80"
    restart: unless-stopped
    environment:
      - SERVER_BASIC_AUTH=${SWS_USER}:${SWS_PASSWORD}
      - SERVER_ROOT=/var/public
    volumes:
      - ./sws/static:/var/public

volumes:
  postgres_data_prod:
  static_volume:
  redis_data:
