---
# Production, on top of docker-compose.yml:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.prod.yml up -d --build
#
# Only nginx is reachable from outside; the database and the backend are
# seen by the other containers only. Everything restarts after a crash or
# a reboot of the server.
services:
  postgres:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    # the card loading script, run in this container, puts the pictures here
    volumes:
      - media:/media
    environment:
      MEDIA_DIR: /media

  # The built app; passes /api and /ws on to the backend
  web:
    build: frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    # gives the pictures out at /media/; read only, nginx has no business changing them
    volumes:
      - media:/usr/share/nginx/media:ro
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

# The meme pictures. Kept by Docker on the server's disk, so they outlive the containers:
# rebuilding or updating the app doesn't touch them (unlike `docker compose down -v`).
volumes:
  media:
