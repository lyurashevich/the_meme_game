---
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-docker_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi: &fastapi
    build:
      context: websockets
      dockerfile: Dockerfile
      target: base
    # depends_on:
      # redis:
        # condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./websockets/src:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command:
      - sh
      - -c
      - uvicorn main:app --reload --host 0.0.0.0 --port 8000

  fastapi-tests:
    <<: *fastapi
    build:
      context: websockets
      target: tests
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./websockets/src:/app
    command:
      - sh
      - -c
      - pytest

  pip-compile-fastapi:
    build:
      context: websockets
      target: tests
    volumes:
      - ./websockets:/app
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - |
        uv pip compile pyproject.toml -o requirements.lock &&
        uv pip compile pyproject.toml --group test -o requirements-tests.lock

  pre-commit:
    build:
      context: django_app
      target: tests
    volumes:
      - ./websockets/src:/app/websockets
      - ./django_app/src:/app/django_app
      - ./.git:/app/.git
      - ./.gitignore:/app/.gitignore
      - ./.pre-commit-config.yaml:/app/.pre-commit-config.yaml
    entrypoint: ["sh", "-c"]
    command:
      - pre-commit run --all-files

  # nginx:
  #   build: nginx
  #   volumes:
  #     - ./ReactUI:/usr/share/nginx/html/
  #     - static_volume:/app/static
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
  #   ports:
  #     - "8080:80"
  #   environment:
  #     - SWS_AUTH=${SWS_AUTH:-YWRtaW46YWRtaW4=}
  #   command: >-
  #     /bin/sh -c "envsubst '$$SWS_AUTH' < /etc/nginx/nginx.conf.template > \
  #     /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
  #   depends_on:
  #     sws:
  #       condition: service_started
  #     django:
  #       condition: service_healthy
  #     fastapi:
  #       condition: service_healthy

  sws:
    image: joseluisq/static-web-server:2-alpine
    ports:
      - "8787:80"
    restart: unless-stopped
    environment:
      - SERVER_BASIC_AUTH=${SWS_USER}:${SWS_PASSWORD}
      - SERVER_ROOT=/var/public
    volumes:
      - ./sws/static:/var/public

volumes:
  pgdata:
  # postgres_data:
  static_volume:
