---
services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-docker_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  django: &django
    build:
      context: django_app
      dockerfile: Dockerfile
      target: base
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./django_app/src:/app
    environment:
      DB_NAME: ${DB_NAME:-docker_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/healthcheck/"]
      interval: 15s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: always
    command:
      - sh
      - -c
      - "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  tests:
    build:
      context: django_app
      target: tests
    volumes:
      - ./django_app/src:/app/src
      - ./.env.example:/app/.env.example
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-docker_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    command:
      - sh
      - -c
      - "python manage.py migrate && pytest"

  pip-compile-django:
    build:
      context: django_app
      target: tests
    volumes:
      - ./django_app:/app
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - pip-compile requirements.in
      - pip-compile requirements-tests.in

  fastapi: &fastapi
    build:
      context: websockets
      dockerfile: Dockerfile
      target: base
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command:
      - sh
      - -c
      - uvicorn main:app --reload --host 0.0.0.0 --port 8000

  fastapi-tests:
    <<: *fastapi
    build:
      target: tests
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./websockets:/app/websockets
    command:
      - sh
      - -c
      - pytest

  redis:
    image: redis:8.0-M03-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pip-compile-fastapi:
    build:
      context: websockets
      target: tests
    volumes:
      - ./websockets:/app
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - pip-compile requirements.in
      - pip-compile requirements-tests.in

  pre-commit:
    build:
      context: django_app
      target: tests
    volumes:
      - ./websockets/src:/app/websockets
      - ./django_app/src:/app/django_app
      - ./.git:/app/.git
      - ./.gitignore:/app/.gitignore
      - ./.pre-commit-config.yaml:/app/.pre-commit-config.yaml
    entrypoint: ["sh", "-c"]
    command:
      - pre-commit run --all-files

  nginx:
    build: nginx
    volumes:
      - ./ReactUI:/usr/share/nginx/html/
      - static_volume:/app/static
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
    ports:
      - "8080:80"
    environment:
      - SWS_AUTH=${SWS_AUTH:-YWRtaW46YWRtaW4=}
    command: >-
      /bin/sh -c "envsubst '$$SWS_AUTH' < /etc/nginx/nginx.conf.template > \
      /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      sws:
        condition: service_started
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy

  sws:
    image: joseluisq/static-web-server:2-alpine
    ports:
      - "8787:80"
    restart: unless-stopped
    environment:
      - SERVER_BASIC_AUTH=${SWS_USER}:${SWS_PASSWORD}
      - SERVER_ROOT=/var/public
    volumes:
      - ./sws/static:/var/public

volumes:
  postgres_data:
  static_volume:
  redis_data:
