---
services:
  fastapi: &fastapi
    build:
      context: websockets
      dockerfile: Dockerfile
      target: base
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command:
      - sh
      - -c
      - uvicorn main:app --reload --host 0.0.0.0 --port 8000

  fastapi-tests:
    <<: *fastapi
    build:
      target: tests
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./websockets:/app/websockets
    command:
      - sh
      - -c
      - pytest

  fastapi_prod:
    <<: *fastapi
    depends_on:
      redis_prod:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis_prod:6379/0
    command:
      - sh
      - -c
      - uvicorn main:app --host 0.0.0.0 --port 8000 --workers $(( 2 * $(nproc)))

  redis: &redis
    image: redis:8.0-M03-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis_prod:
    <<: *redis
    volumes:
      - redis_data:/redis_data
    env_file:
      - .env_redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

  pip-compile: &pip-compile
    build:
      context: websockets
      target: tests
    volumes:
      - ./websockets:/app
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - pip-compile requirements.in
      - pip-compile requirements-tests.in

  pre-commit:
    <<: *pip-compile
    volumes:
      - ./.pre-commit-config.yaml:/app/.pre-commit-config.yaml
      - ./.git:/app/.git
      - ./.gitignore:/app/.gitignore
    command:
      - pre-commit run

  nginx:
    build: .
    volumes:
      - ./ReactUI:/usr/share/nginx/html/
      - static_volume:/app/static
    ports:
      - "8080:80"
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy

volumes:
  static_volume:
  redis_data:
