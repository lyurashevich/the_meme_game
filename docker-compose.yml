---
services:
  db: &db
    image: postgres:17
    restart: always
    env_file:
      - .env-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-docker_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_prod:
    <<: *db
    env_file:
      - .env-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-game_bd_prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./postgres_data_prod:/var/lib/postgresql/data_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db_prod"]

  django: &django
    build:
      context: django_app
      dockerfile: Dockerfile
      target: base
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env-dev
    environment:
      DB_NAME: ${DB_NAME:-docker_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:8000/admin/ || exit 0" ]
      interval: 15s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: always
    command:
      - sh
      - -c
      - "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  django_prod:
    <<: *django
    depends_on:
      db_prod:
        condition: service_healthy
    env_file:
      - .env-prod
    environment:
      DB_NAME: ${DB_NAME:-game_db_prod}
    command:
      - sh
      - -c
      - |
          "gunicorn --workers $((2 * $(nproc)))
          meme_game.wsgi:application --bind 0.0.0.0:8000"

  tests:
    build:
      context: django_app
      target: tests
    volumes:
      - ./django_app/src:/app/src
      - ./.env.example:/app/.env.example
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env-dev
    environment:
      DB_NAME: ${DB_NAME:-docker_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    command:
      - sh
      - -c
      - "python manage.py migrate && pytest"

  pip-compile-django: &pip-compile-django
    build:
      context: django_app
      target: tests
    volumes:
      - ./django_app:/app
    working_dir: /app
    entrypoint: [ "sh", "-c" ]
    command:
      - pip-compile requirements.in
      - pip-compile requirements-tests.in

  pre-commit-django:
    <<: *pip-compile-django
    volumes:
      - ./.pre-commit-config.yaml:/app/.pre-commit-config.yaml
      - ./.git:/app/.git
      - ./.gitignore:/app/.gitignore
    command:
      - pre-commit run --all-files

  fastapi: &fastapi
    build:
      context: websockets
      dockerfile: Dockerfile
      target: base
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command:
      - sh
      - -c
      - uvicorn main:app --reload --host 0.0.0.0 --port 8000

  fastapi-tests:
    <<: *fastapi
    build:
      target: tests
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./websockets:/app/websockets
    command:
      - sh
      - -c
      - pytest

  fastapi_prod:
    <<: *fastapi
    depends_on:
      redis_prod:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis_prod:6379/0
    command:
      - sh
      - -c
      - uvicorn main:app --host 0.0.0.0 --port 8000 --workers $(( 2 * $(nproc)))

  redis: &redis
    image: redis:8.0-M03-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis_prod:
    <<: *redis
    volumes:
      - redis_data:/redis_data
    env_file:
      - .env_redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

  pip-compile-fastapi: &pip-compile-fastapi
    build:
      context: websockets
      target: tests
    volumes:
      - ./websockets:/app
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - pip-compile requirements.in
      - pip-compile requirements-tests.in

  pre-commit-fastapi:
    <<: *pip-compile-fastapi
    volumes:
      - ./.pre-commit-config.yaml:/app/.pre-commit-config.yaml
      - ./.git:/app/.git
      - ./.gitignore:/app/.gitignore
    command:
      - pre-commit run --all-files

  nginx:
    build: .
    volumes:
      - ./ReactUI:/usr/share/nginx/html/
      - static_volume:/app/static
    ports:
      - "8080:80"
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  redis_data:
