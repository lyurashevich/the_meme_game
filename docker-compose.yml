---
# What development and production share: the database and the backend.
#
#   development: docker compose up --build
#     (docker-compose.override.yml is added on its own)
#   production:  docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml up -d --build
#
# ${DB_USER} and the like come from the .env file next to this one.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-meme_game}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ is a plain $ for the container's shell: the check uses
      # whatever user and database were set above
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build: .
    environment:
      # Inside Docker the database is the "db" service on its usual port;
      # DB_HOST and DB_PORT in .env are for running without Docker.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-meme_game}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Python is in the image anyway; curl would be one more package
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # One process only: the game state lives in its memory (Redis later),
    # so several workers would each have their own rooms.
    command: >-
      sh -c "alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
