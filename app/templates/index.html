<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/css/style.css">
  <title>Игра</title>
</head>
<body>
  <h1>Игра: тест WS + REST</h1>

  <div class="header">
      <img id="avatar" class="avatar" alt="Settings" />
    <span id="username"></span>
  </div>

  <div id="scoreModal" class="modal hidden">
    <div class="modal-content">
      <h2>Game score</h2>

      <table id="scoreTable">
        <thead>
          <tr>
            <th>Player</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="scoreList"></tbody>
      </table>

      <button id="closeScoreBtn">Close</button>
    </div>
  </div>

  <button id="score" class="hidden">Score</button>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>Profile settings</h2>

      <label>Name:</label>
      <input id="settingsUsername" type="text" />

      <button id="saveSettingsBtn">Save</button>
      <button id="closeSettingsBtn">Close</button>
    </div>
  </div>

  <div id="leaveConfirmModal" class="modal hidden">
    <div class="modal-content">
      <h2>Выйти из комнаты?</h2>
      <p>Идёт игра, и после вашего выхода останется слишком мало игроков.
         Игра будет завершена для всех. Вы уверены?</p>

      <button id="confirmLeaveBtn">Да, выйти</button>
      <button id="cancelLeaveBtn">Нет, остаться</button>
    </div>
  </div>

  <!-- Модалка настроек игры. Та же структура .modal/.modal-content, что и у остальных
       окон, чтобы переиспользовать готовые стили. hidden = скрыта, пока JS её не откроет. -->
  <div id="gameSettingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>Game settings</h2>

      <!-- round_time_limit: бэк принимает строго 60/90/120, поэтому select, а не свободный ввод.
           value у option — это то, что реально уйдёт на сервер. -->
      <label>Round time limit (sec):</label>
      <select id="settingRoundTime">
        <option value="60">60</option>
        <option value="90">90</option>
        <option value="120">120</option>
      </select>

      <!-- max_rounds и score_to_win опциональны: пустое поле = безлимит (null на бэке). -->
      <label>Max rounds (empty = unlimited):</label>
      <input id="settingMaxRounds" type="number" min="1" placeholder="unlimited" />

      <label>Score to win (empty = unlimited):</label>
      <input id="settingScoreToWin" type="number" min="1" placeholder="unlimited" />

      <button id="saveGameSettingsBtn">Save</button>
      <button id="closeGameSettingsBtn">Close</button>
    </div>
  </div>

  <button id="connectBtn">Подключиться (создать игрока)</button>
  <button id="createRoomBtn" class="hidden">Создать комнату</button>

  <div id="rooms" style="margin-top: 20px"></div>

  <div id="roomInfo" class="room-info hidden">
    <h3>You are in the room: <span id="currentRoomName"></span></h3>
    <button id="leaveRoomBtn">Leave room</button>
    <button id="startGameBtn">Start game</button>
    <!-- Кнопка настроек. class="hidden" -> по умолчанию скрыта;
         JS покажет её только владельцу комнаты (см. updateGameSettingsButton в ui.js). -->
    <button id="gameSettingsBtn" class="hidden">Game settings</button>
  </div>

  <div id="chatContainer" class="chat-container hidden">
    <h3>Chat room</h3>
    <div id="messages" class="messages"></div>
    <div class="chat-input">
      <input type="text" id="chatMessage" placeholder="Enter your message..." maxlength="500">
      <button id="sendMessage">Send</button>
    </div>
  </div>

  <div id="roundInfo"></div>

  <div id="tableArea" class="table-area hidden"></div>

  <div id="playerCards" class="player-cards hidden">
    <h3>Your cards</h3>
    <div id="cardsContainer" class="cards-container"></div>
  </div>

  <button id="confirmChoice" class="hidden">Choose</button>
  <button id="confirmWinner" class="hidden">Confirm winner</button>

  <pre id="log"></pre>

  <script src="/static/js/ui.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/game.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/score.js"></script>
  <script src="/static/js/room.js"></script>

</body>
</html>
