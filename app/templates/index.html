<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
  <title>Meme Game</title>
</head>
<body>
<div class="page-container">
  <h1>Meme Game</h1>

  <div class="header">
      <img id="avatar" class="avatar" alt="Settings" />
    <span id="username"></span>
  </div>

  <div id="scoreModal" class="modal hidden">
    <div class="modal-content">
      <h2>Game score</h2>

      <table id="scoreTable">
        <thead>
          <tr>
            <th>Player</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="scoreList"></tbody>
      </table>

      <button id="closeScoreBtn" class="btn btn-secondary">Close</button>
    </div>
  </div>

  <button id="score" class="btn btn-primary hidden">Score</button>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>Profile settings</h2>

      <label>Name:</label>
      <input id="settingsUsername" type="text" />

      <button id="saveSettingsBtn" class="btn btn-primary">Save</button>
      <button id="closeSettingsBtn" class="btn btn-secondary">Close</button>
    </div>
  </div>

  <div id="leaveConfirmModal" class="modal hidden">
    <div class="modal-content">
      <h2>Leave the room?</h2>
      <p>The game is in progress, and if you leave there won't be enough players left.
         The game will end for everyone. Are you sure?</p>

      <button id="confirmLeaveBtn" class="btn btn-danger">Yes, leave</button>
      <button id="cancelLeaveBtn" class="btn btn-secondary">No, stay</button>
    </div>
  </div>

  <!-- Game settings modal. Same .modal/.modal-content structure as the other
       modals so it reuses existing styles. hidden = hidden until JS opens it. -->
  <div id="gameSettingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>Game settings</h2>

      <!-- round_time_limit: the backend strictly accepts 60/90/120, hence a select,
           not free input. The option's value is what actually gets sent to the server. -->
      <label>Round time limit (sec):</label>
      <select id="settingRoundTime">
        <option value="60">60</option>
        <option value="90">90</option>
        <option value="120">120</option>
      </select>

      <!-- max_rounds and score_to_win are optional: an empty field means unlimited (null on the backend). -->
      <label>Max rounds (empty = unlimited):</label>
      <input id="settingMaxRounds" type="number" min="1" placeholder="unlimited" />

      <label>Score to win (empty = unlimited):</label>
      <input id="settingScoreToWin" type="number" min="1" placeholder="unlimited" />

      <button id="saveGameSettingsBtn" class="btn btn-primary">Save</button>
      <button id="closeGameSettingsBtn" class="btn btn-secondary">Close</button>
    </div>
  </div>

  <div class="toolbar">
    <button id="connectBtn" class="btn btn-primary btn-pill">Connect (create player)</button>
    <button id="createRoomBtn" class="btn btn-primary btn-pill hidden">Create room</button>
  </div>

  <div id="rooms"></div>

  <div id="roomInfo" class="room-info hidden">
    <h3>You are in the room: <span id="currentRoomName"></span></h3>
    <button id="leaveRoomBtn" class="btn btn-danger">Leave room</button>
    <button id="startGameBtn" class="btn btn-primary">Start game</button>
    <!-- Settings button. class="hidden" -> hidden by default;
         JS shows it only to the room owner (see updateGameSettingsButton in ui.js). -->
    <button id="gameSettingsBtn" class="btn btn-secondary hidden">Game settings</button>
  </div>

  <div class="game-layout">
    <div class="game-board">
      <div id="roundInfo"></div>

      <div id="tableArea" class="table-area hidden"></div>

      <div id="playerCards" class="player-cards hidden">
        <h3>Your cards</h3>
        <div id="cardsContainer" class="cards-container"></div>
      </div>

      <button id="confirmChoice" class="btn btn-primary hidden">Choose</button>
      <button id="confirmWinner" class="btn btn-primary hidden">Confirm winner</button>
    </div>

    <div class="side-panel">
      <div id="chatContainer" class="chat-container hidden">
        <h3>Chat room</h3>
        <div id="messages" class="messages"></div>
        <div class="chat-input">
          <input type="text" id="chatMessage" placeholder="Enter your message..." maxlength="500">
          <button id="sendMessage">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

  <pre id="log"></pre>

  <script src="/static/js/ui.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/game.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/score.js"></script>
  <script src="/static/js/room.js"></script>

</body>
</html>
