<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/css/style.css">
  <title>Игра</title>
</head>
<body>
  <h1>Игра: тест WS + REST</h1>

  <button id="connectBtn">Подключиться (создать игрока)</button>
  <button id="createRoomBtn" disabled>Создать комнату</button>

  <div id="rooms" style="margin-top: 20px"></div>

  <div id="roomInfo" class="room-info hidden">
    <h3>You are in the room: <span id="currentRoomName"></span></h3>
    <button id="leaveRoomBtn">Leave room</button>
    <button id="startGameBtn">Start game</button>
  </div>

  <div id="chatContainer" class="chat-container hidden">
    <h3>Chat room</h3>
    <div id="messages" class="messages"></div>
    <div class="chat-input">
      <input type="text" id="chatMessage" placeholder="Enter your message..." maxlength="500">
      <button id="sendMessage">Send</button>
    </div>
  </div>

  <div id="roundInfo"></div>

  <div id="tableArea" class="table-area hidden"></div>

  <div id="playerCards" class="player-cards hidden">
    <h3>Your cards</h3>
    <div id="cardsContainer" class="cards-container"></div>
  </div>

  <button id="confirmChoice">Choose</button>

  <pre id="log"></pre>

  <script src="/static/js/ui.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/game.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/main.js"></script>

</body>
</html>
