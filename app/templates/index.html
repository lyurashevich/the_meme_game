<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Игра</title>
  <style>
    .chat-container {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 10px;
      max-width: 400px;
    }
    .messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 10px;
      margin-bottom: 10px;
    }
    .message {
      margin-bottom: 5px;
    }
    .message-sender {
      font-weight: bold;
      color: #333;
    }
    .message-time {
      font-size: 0.8em;
      color: #666;
    }
    .chat-input {
      display: flex;
      gap: 10px;
    }
    #chatMessage {
      flex: 1;
      padding: 5px;
    }
    #sendMessage {
      padding: 5px 10px;
    }
    .hidden {
      display: none;
    }
    .room_info {
      margin: 10px 0;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 5px;
    }
    #leaveRoomBtn {
      margin-left: 10px;
      background-color: #ff4444;
      color: white;
    }
    }
  </style>
</head>
<body>
  <h1>Игра: тест WS + REST</h1>

  <button id="connectBtn">Подключиться (создать игрока)</button>
  <button id="createRoomBtn" disabled>Создать комнату</button>

  <div id="rooms" style="margin-top: 20px"></div>

  <div id="roomInfo" class="room-info hidden">
    <h3>You are in the room: <span id="currentRoomName"></span></h3>
    <button id="leaveRoomBtn">Leave room</button>
  </div>

  <div id="chatContainer" class="chat-container hidden">
    <h3>Chat room</h3>
    <div id="messages" class="messages"></div>
    <div class="chat-input">
      <input type="text" id="chatMessage" placeholder="Enter your message..." maxlength="500">
      <button id="sendMessage">Send</button>
    </div>
  </div>

  <pre id="log"></pre>

  <script>
    let ws;
    let playerId;
    let currentRoomId = null;
    let currentRoomName = null;

    function showRoomInterface(roomId, roomName) {
      currentRoomId = roomId;
      currentRoomName = roomName;

      document.getElementById('roomInfo').classList.remove('hidden');
      document.getElementById('currentRoomName').textContent = roomName;

      document.getElementById('chatContainer').classList.remove('hidden');

      document.getElementById('rooms').classList.add('hidden');
      document.getElementById('connectBtn').classList.add('hidden');
      document.getElementById('createRoomBtn').classList.add('hidden');
    }

    function hiddenRoomInterface() {
      currentRoomId = null;
      currentRoomName = null;

      document.getElementById('roomInfo').classList.add('hidden');
      document.getElementById('chatContainer').classList.add('hidden');

      document.getElementById('rooms').style.display = 'inline-block';
      document.getElementById('createRoomBtn').style.display = 'inline-block';

      document.getElementById('messages').innerHTML = '';
      document.getElementById('chatMessage').value = '';
    }


    function displayChatMessage(data) {
      const messagesContainer = document.getElementById('messages');
      const messageElement = document.createElement('div');
      messageElement.className = 'message';

      const time = new Date(data.timestamp).toLocaleTimeString();
      messageElement.innerHTML = `
        <span class="message-sender">${data.player_name || 'Anonymous'}:</span>
        <span>${data.message}</span>
        <span class="message-time">${time}</span>
      `;

      messagesContainer.appendChild(messageElement);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function loadChatHistory(roomId) {
      try {
        const response = await fetch(`/room/${roomId}/messages`);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const messages = await response.json();

        if (!Array.isArray(messages)) {
          console.warn('Messages is not an array:', messages);
          return;
        }

        const messagesContainer = document.getElementById('messages');
        messagesContainer.innerHTML = '';

        messages.forEach(message => {
          displayChatMessage(message);
        });
      } catch (error) {
        console.error('Error load chat history:', error);
      }
    }

    async function joinRoom(roomId, roomName) {
      try {
        const response = await fetch(`/room/${roomId}`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            player_id: playerId
          })
        });

        if (response.ok) {
          currentRoomId = roomId;
          document.getElementById('chatContainer').classList.remove('hidden');
          await showRoomInterface(roomId, roomName);
          await loadChatHistory(roomId);
          log('you have joine the room: ' + roomId);
        } else {
          const error = await response.json();
          alert("error: " + error.detail);
        }
      } catch (error) {
        alert ("connection error: " + error);
      }
    }

    async function loadRooms() {
      try {
        const response = await fetch("/room/all");
        const rooms = await response.json();

        const container = document.getElementById("rooms");
        container.innerHTML = "";

        rooms.forEach(room => {
          const div = document.createElement("div");
          div.innerHTML = `
            <p>Room: ${room.name} | Players: ${room.players_count}/${room.max_players}</p>
            <button onclick="joinRoom('${room.id}', '${room.name}')">Join room</button>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        log("error: " + error);
      }
    }

    function log(msg) {
      document.getElementById("log").textContent += msg + "\n";
    }

    document.getElementById("connectBtn").addEventListener("click", () => {
      ws = new WebSocket("ws://localhost:8000/ws/");

      ws.onopen = () => {
        log("WS соединение установлено");
        loadRooms();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.event === "player_created") {
            playerId = data.player_id;
            log("Создан игрок с id: " + playerId);
            document.getElementById("createRoomBtn").disabled = false;
        } else if (data.event == 'chat_message') {
          if (currentRoomId && data.room_id === currentRoomId) {
            displayChatMessage(data);
          }
        }
      } catch (error) {
        console.error('Error parsing WebSocket message:', error)
      }
    };

      ws.onclose = () => log("WS соединение закрыто");
      ws.onerror = (error) => log("ws error: " + error);
    });

    document.getElementById("sendMessage").addEventListener("click", () => {
      const messageInput = document.getElementById("chatMessage");
      const message = messageInput.value.trim();

      if (!message) return;

      if (!currentRoomId) {
        alert("You have to be joined to the room");
        return;
      }

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("WebSocket connection has not established");
        return;
      }

      ws.send(JSON.stringify({
        event: 'chat_message',
        room_id: currentRoomId,
        message: message
      }));

      messageInput.value = '';
    })

    document.getElementById('chatMessage').addEventListener('keypress', (e) => {
      if (e.key == 'Enter') {
        document.getElementById('sendMessage').click();
      }
    });

    document.getElementById("createRoomBtn").addEventListener("click", async () => {
      if (!playerId) {
        log("Сначала подключитесь!");
        return;
      }

      try {
        const response = await fetch("/room/", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ player_id: playerId })
      });

      const room = await response.json();
      log("Создана комната: " + JSON.stringify(room, null, 2));

      showRoomInterface(room.id, room.name);
      await loadChatHistory(room.id);
    } catch (error) {
      log("ошибка создания комнаты: " + error);
    }
    });

    document.getElementById("leaveRoomBtn").addEventListener("click", async () => {
      if (!playerId || !currentRoomId) {
        log("you are not in the room");
        return;
      }

      try {
        const response = await fetch(`/room/${currentRoomId}/leave`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ player_id: playerId })
        });

        if (!response.ok) {
          const error = await response.json();
          log("an error occured during leavin the room: " + error.detail);
          return;
        }

        log("you have left the room: " + currentRoomId);

        hiddenRoomInterface();
        await loadRooms();
      } catch (error) {
        log("an error occured during leaving the room: " + error)
      }
    })
  </script>
</body>
</html>
