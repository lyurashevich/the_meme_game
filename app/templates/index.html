<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/css/style.css">
  <title>Игра</title>
</head>
<body>
  <h1>Игра: тест WS + REST</h1>

  <div class="header">
      <img id="avatar" class="avatar" alt="Settings" />
    <span id="username"></span>
  </div>

  <div id="scoreModal" class="modal hidden">
    <div class="modal-content">
      <h2>Game score</h2>

      <table id="scoreTable">
        <thead>
          <tr>
            <th>Player</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="scoreList"></tbody>
      </table>

      <button id="closeScoreBtn">Close</button>
    </div>
  </div>

  <button id="score" class="hidden">Score</button>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>Profile settings</h2>

      <label>Name:</label>
      <input id="settingsUsername" type="text" />

      <button id="saveSettingsBtn">Save</button>
      <button id="closeSettingsBtn">Close</button>
    </div>
  </div>

  <div id="leaveConfirmModal" class="modal hidden">
    <div class="modal-content">
      <h2>Выйти из комнаты?</h2>
      <p>Идёт игра, и после вашего выхода останется слишком мало игроков.
         Игра будет завершена для всех. Вы уверены?</p>

      <button id="confirmLeaveBtn">Да, выйти</button>
      <button id="cancelLeaveBtn">Нет, остаться</button>
    </div>
  </div>

  <button id="connectBtn">Подключиться (создать игрока)</button>
  <button id="createRoomBtn" class="hidden">Создать комнату</button>

  <div id="rooms" style="margin-top: 20px"></div>

  <div id="roomInfo" class="room-info hidden">
    <h3>You are in the room: <span id="currentRoomName"></span></h3>
    <button id="leaveRoomBtn">Leave room</button>
    <button id="startGameBtn">Start game</button>
  </div>

  <div id="chatContainer" class="chat-container hidden">
    <h3>Chat room</h3>
    <div id="messages" class="messages"></div>
    <div class="chat-input">
      <input type="text" id="chatMessage" placeholder="Enter your message..." maxlength="500">
      <button id="sendMessage">Send</button>
    </div>
  </div>

  <div id="roundInfo"></div>

  <div id="tableArea" class="table-area hidden"></div>

  <div id="playerCards" class="player-cards hidden">
    <h3>Your cards</h3>
    <div id="cardsContainer" class="cards-container"></div>
  </div>

  <button id="confirmChoice" class="hidden">Choose</button>
  <button id="confirmWinner" class="hidden">Confirm winner</button>

  <pre id="log"></pre>

  <script src="/static/js/ui.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/game.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/score.js"></script>
  <script src="/static/js/room.js"></script>

</body>
</html>
